# Maintainer roster for Argo
# Documentation: https://github.com/cncf/automation/tree/main/utilities/dot-project
#
# AUTHORITATIVE SOURCE OF TRUTH for Argo maintainer membership and groups.
# In Argo, maintainers are the union of the maintainers of the five subprojects
# (argo-cd, argo-events, argo-rollouts, argo-workflows, argo-helm).
#
# Roles are cumulative: a lead is also an approver and a reviewer; an approver
# is also a reviewer. Membership is therefore listed explicitly at every tier a
# person holds (e.g. a lead appears in `<sub>-leads`, `<sub>-approvers` and
# `<sub>-maintainers`).
#
# How this file is used:
#   - Each managed team below is a maintainer group and is provisioned by CNCF
#     (service desk, mailing list, Copilot seats). The set of maintainers is the
#     union of the members of all managed teams.
#   - The org-team-sync automation reconciles the matching GitHub org teams.
#   - This file is the source of truth for membership. The human-readable
#     argoproj/argoproj MAINTAINERS.md is updated by hand to match it.
#   - The "emeritus" team (managed: false) tracks former maintainers and is
#     excluded from CNCF resource provisioning.
#
# Editing this file affects GitHub org team membership, so changes are
# code-owned by the subproject leads (see CODEOWNERS).
#
# Maintainers: Please connect your GitHub handle to your LFID on openprofile.dev to enable automatic access to CNCF resources. The system will use your primary email address for setup.
maintainers:
