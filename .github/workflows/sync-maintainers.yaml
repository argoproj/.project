name: Sync Maintainers

# maintainers.yaml is the authoritative source for Argo maintainer membership
# and groups. On PR we show the planned changes (dry-run). On merge to main we
# reconcile the GitHub org teams.
#
# MAINTAINERS.md in argoproj/argoproj is maintained by hand (it points back to
# this maintainers.yaml as the source of truth) and is NOT regenerated here.
#
# Auth (see docs/automation.md): a GitHub App (org Members: read+write) whose
# credentials are stored as repo secrets:
#   APP_ID           - the GitHub App's numeric App ID.
#   APP_PRIVATE_KEY  - the GitHub App's private key (.pem contents).
# A short-lived installation token is minted per run by create-github-app-token.

on:
  pull_request:
    paths:
      - 'maintainers.yaml'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - 'maintainers.yaml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Safe to cancel in-progress --apply runs: sync-org-teams is a full
  # reconcile, so the surviving run writes the latest maintainers.yaml state.
  cancel-in-progress: true

jobs:
  team-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v6.0.0
        with:
          go-version-file: scripts/go.mod
      - name: Mint GitHub App installation token
        id: app-token
        if: ${{ vars.APP_ID != '' }}
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.0.6
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Org Members writes do not need repo contents; still pin the token
          # to this repository so it cannot touch the rest of the installation.
          repositories: ${{ github.event.repository.name }}
          permission-members: write
      - name: Reconcile org teams
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
        working-directory: scripts
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "GitHub App not configured (set APP_ID var + APP_PRIVATE_KEY secret); skipping (see docs/automation.md)"
            exit 0
          fi
          if [ "$EVENT_NAME" = "push" ]; then
            go run ./cmd/sync-org-teams --maintainers-yaml ../maintainers.yaml --apply
          else
            go run ./cmd/sync-org-teams --maintainers-yaml ../maintainers.yaml
          fi
